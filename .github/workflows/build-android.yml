name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show dependency versions
        run: |
          node -v
          npm -v
          node -e "const p=require('./package.json'); console.log('package.json jspdf:', p.dependencies.jspdf, 'autotable:', p.dependencies['jspdf-autotable'])"
          node -e "const p=require('./package-lock.json'); console.log('package-lock root jspdf:', p.packages[''].dependencies.jspdf, 'locked jspdf:', p.packages['node_modules/jspdf']?.version)"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled at $ANDROID_HOME.
      # Use its own sdkmanager (no sudo, no re-download) so file ownership stays correct.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          fi
          echo "Using $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add biometric permission to AndroidManifest
        run: |
          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>' android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/aleph-orders.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aleph-orders-apk
          path: android/app/build/outputs/apk/debug/aleph-orders.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aleph-orders-windows
          path: desktop/release/aleph-orders-setup.exe
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: dist-files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            dist-files/aleph-orders.apk
            dist-files/aleph-orders-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
